name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sketchnoobdeveloper/bomberman-android
          token: ${{ secrets.SRC_PAT }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: src
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug and release
        working-directory: src
        run: gradle :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bomberman-apk
          path: src/app/build/outputs/apk/**/*.apk
