name: functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/functions.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sketchnoobdeveloper/bomberman-functions
          token: ${{ secrets.SRC_PAT }}
          path: src
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: src
      - run: npm run typecheck
        working-directory: src
      - run: npm run build
        working-directory: src
